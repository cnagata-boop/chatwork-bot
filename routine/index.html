<title>まいにちルーティン帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&display=swap">
<style>
/* Layout: one narrow column like a sticker notebook. Today's ring and five habit cards first, then calendar, weight chart and badges. */
:root {
  --bg: #dfeae5;
  --paper: #fffdfb;
  --ink: #253634;
  --muted: #73837f;
  --line: #cfe5dc;
  --soft: #e8f5ef;
  --accent: #9e5a62;
  --accent-ink: #ffffff;
  --study: #5b7fa6;
  --exercise: #b85c50;
  --stretch: #5f8f73;
  --beauty: #8a7bb0;
  --weight: #b88a52;
  --gold: #b89a5a;
  --blob1: transparent; --blob2: transparent; --blob3: transparent; --blob4: transparent;
  --shadow: 0 1px 2px rgba(29, 42, 77, .06);
  --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --f-num: "Cormorant Garamond", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1730; --paper: #12234a; --ink: #eaf5ff; --muted: #93a8cb; --line: #25406c; --soft: #183059;
    --accent: #b48cf0; --accent-ink: #120a24;
    --study: #82a8ff; --exercise: #ff7b6f; --stretch: #3fd8c6; --beauty: #c79af6; --weight: #5cc7f2; --gold: #f2cd6c;
    --blob1: transparent; --blob2: transparent; --blob3: transparent; --blob4: transparent;
    --shadow: 0 1px 2px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #0b1730; --paper: #12234a; --ink: #eaf5ff; --muted: #93a8cb; --line: #25406c; --soft: #183059;
    --accent: #b48cf0; --accent-ink: #120a24;
    --study: #82a8ff; --exercise: #ff7b6f; --stretch: #3fd8c6; --beauty: #c79af6; --weight: #5cc7f2; --gold: #f2cd6c;
    --blob1: transparent; --blob2: transparent; --blob3: transparent; --blob4: transparent;
    --shadow: 0 1px 2px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  background-image:
    radial-gradient(circle at 8% 4%, color-mix(in srgb, var(--blob1) 55%, transparent) 0, transparent 260px),
    radial-gradient(circle at 96% 22%, color-mix(in srgb, var(--blob2) 50%, transparent) 0, transparent 280px),
    radial-gradient(circle at 4% 58%, color-mix(in srgb, var(--blob3) 45%, transparent) 0, transparent 300px),
    radial-gradient(circle at 92% 86%, color-mix(in srgb, var(--blob4) 55%, transparent) 0, transparent 300px),
    radial-gradient(var(--line) 1.2px, transparent 1.6px);
  background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 22px 22px;
  background-attachment: fixed;
  font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 64px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
h2 { font-size: 18px; font-weight: 700; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.label { font-size: 12px; letter-spacing: .06em; color: var(--muted); font-weight: 500; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-size: 22px; font-weight: 900; letter-spacing: .02em; }
.brand small { display: block; font-family: var(--f-body); font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .04em; }
.level { display: flex; align-items: center; gap: 10px; background: var(--paper); border-radius: 999px; padding: 6px 14px 6px 6px; box-shadow: var(--shadow); }
.level .lv { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 900; font-size: 15px; line-height: 1; }
.level .lv span { font-size: 9px; display: block; letter-spacing: .05em; }
.level .meta { display: flex; flex-direction: column; min-width: 120px; }
.level .title { font-size: 13px; font-weight: 700; }
.xpbar { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; margin-top: 3px; }
.xpbar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .5s; }

/* date nav */
.datenav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.datenav .d { text-align: center; flex: 1; }
.datenav .d b { font-family: var(--f-display); font-size: 20px; }
.datenav .d .label { display: block; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); display: grid; place-items: center; font-size: 18px; }
.iconbtn:disabled { opacity: .35; cursor: default; }
.todaylink { border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 13px; text-decoration: underline; padding: 0; }

/* hero */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; background: var(--paper); border-radius: 22px; padding: 20px; box-shadow: var(--shadow); }
.ring { width: 132px; height: 132px; position: relative; }
.ring svg { width: 100%; height: 100%; display: block; }
.ring .center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .center b { font-family: var(--f-num); font-size: 52px; font-weight: 500; line-height: 1; font-variant-numeric: lining-nums; }
.ring .center .of { display: inline; font-family: var(--f-num); font-size: 18px; color: var(--muted); margin-left: 2px; }
.ring .center .cap { display: block; font-size: 9px; letter-spacing: .32em; color: var(--muted); margin-top: 6px; padding-left: .32em; }
.ring .center span { display: block; font-size: 11px; color: var(--muted); }
.hero .msg { font-family: var(--f-display); font-size: 17px; font-weight: 700; line-height: 1.5; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; }
.stat b { font-family: var(--f-num); font-size: 22px; font-weight: 600; display: block; line-height: 1.2; }
.stat .label { font-size: 11px; }
@media (max-width: 440px) { .hero { grid-template-columns: 1fr; justify-items: center; text-align: center; } .stats { justify-content: center; } }

/* habit cards */
.habits { display: flex; flex-direction: column; gap: 12px; }
.habit { --c: var(--accent); background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 16px; display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: start; border: 2px solid transparent; transition: border-color .2s; }
.habit.done { border-color: var(--c); }
.check { width: 56px; height: 56px; border-radius: 16px; border: 2.5px dashed var(--c); background: transparent; display: grid; place-items: center; font-size: 26px; color: var(--c); transition: transform .15s, background .2s; position: relative; }
.check svg { width: 28px; height: 28px; }
.habit.done .check { background: var(--c); border-style: solid; color: var(--paper); }
.check:active { transform: scale(.92); }
.habit.pop .check { animation: pop .45s ease; }
@keyframes pop { 0% { transform: scale(.8) rotate(-8deg); } 60% { transform: scale(1.15) rotate(4deg); } 100% { transform: scale(1) rotate(0); } }
.hbody { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.hhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.hname { font-family: var(--f-display); font-size: 17px; font-weight: 700; }
.streak { font-size: 12px; color: var(--muted); white-space: nowrap; }
.streak b { color: var(--c); font-family: var(--f-num); font-size: 14px; }
.menu { display: flex; align-items: center; gap: 8px; font-size: 14px; background: var(--soft); border-radius: 10px; padding: 6px 6px 6px 10px; }
.menu span { flex: 1; min-width: 0; }
.menu .tag { font-size: 11px; color: var(--c); font-weight: 700; margin-right: 4px; }
.shuffle { border: 0; background: var(--paper); border-radius: 8px; font-size: 12px; padding: 4px 8px; color: var(--muted); white-space: nowrap; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 500; }
.chip.primary { background: var(--c); border-color: var(--c); color: var(--paper); }
.mins { font-family: var(--f-num); font-size: 18px; font-weight: 600; color: var(--c); margin-right: 4px; }
.weightin { display: flex; align-items: center; gap: 6px; }
.weightin input { width: 96px; font-family: var(--f-num); font-size: 20px; font-weight: 600; padding: 4px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
.diff { font-size: 13px; color: var(--muted); }
.timer { font-family: var(--f-num); font-size: 15px; font-weight: 600; color: var(--c); }

.memo textarea { width: 100%; min-height: 64px; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font: inherit; background: var(--paper); color: var(--ink); resize: vertical; }

/* panels */
.panel { background: var(--paper); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
.phead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal .wd { text-align: center; font-size: 11px; color: var(--muted); }
.cal .wd.sun { color: var(--beauty); } .cal .wd.sat { color: var(--study); }
.day { aspect-ratio: 1; max-width: 100%; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-family: var(--f-num); padding: 0; position: relative; }
.day.empty { border: 0; background: none; }
.day.future { opacity: .4; cursor: default; }
.day.sel { outline: 2.5px solid var(--ink); outline-offset: 1px; }
.day.today { font-weight: 700; }
.dots { display: flex; gap: 2px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
.day.perfect { background: var(--gold); border-color: var(--gold); color: #fff; }
.day.perfect .dots i { background: rgba(255,255,255,.85) !important; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

/* chart */
.chart { width: 100%; overflow-x: auto; }
.chart svg { width: 100%; height: auto; display: block; min-width: 300px; }
.chart text { fill: var(--muted); font-family: var(--f-num); font-size: 10px; }
.empty-note { font-size: 13px; color: var(--muted); background: var(--soft); border-radius: 12px; padding: 12px; }

/* badges */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.badge { border-radius: 14px; border: 1px dashed var(--line); padding: 10px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.badge .ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--muted); font-family: var(--f-display); font-weight: 900; font-size: 15px; }
.badge b { font-size: 13px; font-family: var(--f-display); }
.badge small { font-size: 11px; color: var(--muted); line-height: 1.4; }
.badge.got { border-style: solid; border-color: var(--gold); }
.badge.got .ic { background: var(--gold); color: #fff; }

/* settings */
.settings { display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.settings label { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.settings input { width: 110px; font-family: var(--f-num); padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font-size: 15px; }
.savestate { font-size: 12px; color: var(--muted); }

.toast { position: fixed; left: 50%; transform: translateX(-50%) translateY(20px); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; max-width: calc(100% - 32px); text-align: center; z-index: 20; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.quick { display: none; }
.swipehint { display: none; text-align: center; font-size: 11px; color: var(--muted); margin-top: -14px; }
@media (max-width: 600px) {
  body { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
  .quick { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; gap: 4px; justify-content: space-between;
    background: var(--paper); border-top: 1px solid var(--line); box-shadow: 0 -6px 18px -12px rgba(0,0,0,.35);
    padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
  .qbtn { --c: var(--accent); flex: 1; min-width: 0; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 2px 0; font-size: 11px; font-weight: 700; color: var(--muted); }
  .qbtn .dot { width: 46px; height: 46px; border-radius: 14px; border: 2.5px dashed var(--c); display: grid; place-items: center; color: var(--c); font-family: var(--f-display); font-size: 17px; font-weight: 900; transition: transform .15s, background .2s; }
  .qbtn .dot svg { width: 24px; height: 24px; }
  .greet { font-size: 21px; }
  .qbtn.on { color: var(--ink); }
  .qbtn.on .dot { background: var(--c); border-style: solid; color: var(--paper); }
  .qbtn:active .dot { transform: scale(.9); }
  .toast { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .hero { padding: 16px; gap: 12px; }
  .ring { width: 112px; height: 112px; }
  .swipehint { display: block; }
}
input, textarea { font-size: 16px !important; }
.weightin input { font-size: 20px !important; }
/* sky header: colors follow the time of day */
.sky { position: relative; overflow: hidden; border-radius: 26px; padding: 20px 20px 18px; color: var(--sky-ink); background: linear-gradient(160deg, var(--s1), var(--s2)); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
.sky.t-morning { --s1: #ffd3a3; --s2: #fff1c9; --sky-ink: #4b2a10; --orb: #ffb23e; }
.sky.t-day     { --s1: #a9e3f5; --s2: #d9f6e4; --sky-ink: #12384a; --orb: #ffd34d; }
.sky.t-evening { --s1: #ffa98f; --s2: #ffd7a1; --sky-ink: #4a1d14; --orb: #ff7a4d; }
.sky.t-night   { --s1: #1b2b55; --s2: #2e4a7a; --sky-ink: #f2f5ff; --orb: #ffe9a6; }
.orb { position: absolute; right: -26px; top: -26px; width: 120px; height: 120px; border-radius: 50%; background: var(--orb); opacity: .9; box-shadow: 0 0 0 18px color-mix(in srgb, var(--orb) 25%, transparent), 0 0 0 40px color-mix(in srgb, var(--orb) 12%, transparent); }
.sky.t-night .orb { width: 80px; height: 80px; right: 18px; top: 14px; box-shadow: inset -16px -6px 0 0 #2a4372; }
.stars { position: absolute; inset: 0; pointer-events: none; display: none; }
.sky.t-night .stars { display: block; }
.stars i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; opacity: .8; animation: twinkle 2.6s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .2; } }
.sky .brand, .sky .brand small { color: var(--sky-ink); position: relative; }
.greet { position: relative; font-family: var(--f-display); font-weight: 900; font-size: 24px; line-height: 1.35; }
.quote { position: relative; font-size: 13px; font-weight: 500; opacity: .85; max-width: 30em; }
.sky .level { align-self: flex-start; position: relative; }
/* mascot in the ring */
.mascot { width: 84px; height: 84px; }
.mascot.bounce { animation: bounce .6s ease; }
@keyframes bounce { 0% { transform: rotate(-12deg) scale(.92); } 100% { transform: rotate(0) scale(1); } }
.count { font-family: var(--f-display); font-size: 15px; font-weight: 700; color: var(--muted); }
.count b { font-size: 30px; color: var(--ink); font-family: var(--f-num); }
/* sticker cards */
.habit { position: relative; overflow: hidden; }
.habit.done { background: color-mix(in srgb, var(--c) 10%, var(--paper)); }
.check .ico { width: 30px; height: 30px; }
.stamp { position: absolute; left: 14px; bottom: 12px; font-family: var(--f-display); font-weight: 900; font-size: 13px; color: var(--c); border: 2px solid var(--c); border-radius: 8px; padding: 0 8px; transform: rotate(-10deg); opacity: .85; pointer-events: none; }
.habit.pop .stamp { animation: stamp .4s ease; }
@keyframes stamp { 0% { transform: rotate(-10deg) scale(2.2); opacity: 0; } 100% { transform: rotate(-10deg) scale(1); opacity: .85; } }
.plus { position: fixed; z-index: 16; pointer-events: none; font-family: var(--f-display); font-weight: 900; font-size: 18px; color: var(--c); animation: floatup .9s ease-out forwards; }
@keyframes floatup { to { transform: translateY(-60px); opacity: 0; } }
/* keep-going helpers */
.nudge { background: var(--paper); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; border: 2px dashed var(--gold); }
.nudge b { font-family: var(--f-display); font-size: 16px; }
.nudge p { margin: 0; font-size: 13px; color: var(--muted); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 700; }
.btn.main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.on { background: var(--gold); border-color: var(--gold); color: #fff; }
.next { font-size: 13px; color: var(--muted); margin-top: 8px; }
.next b { color: var(--ink); }
.hero .btnrow { margin-top: 10px; }
@media (max-width: 440px) { .hero .btnrow { justify-content: center; } }
.when { font-size: 12px; color: var(--muted); }
.when b { color: var(--c); font-weight: 700; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.week .w { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.week .w i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-family: var(--f-num); font-size: 12px; font-weight: 600; background: var(--soft); color: var(--muted); }
.week .w.has i { background: color-mix(in srgb, var(--accent) 22%, var(--paper)); color: var(--ink); }
.week .w.full i { background: var(--gold); color: #fff; }
.week .w.rest i { background: var(--paper); border: 2px dashed var(--muted); }
.week .w.today { color: var(--ink); font-weight: 700; }
.wgoal { font-size: 13px; }
.wgoal .xpbar { height: 8px; }
.wgoal .xpbar i { background: var(--gold); }
.day.rest { border-style: dashed; border-color: var(--muted); }
.settings .plan input { width: 180px; font-family: var(--f-body); }
/* chic layer: hairlines, muted tints, quiet type */
body { background-image: none !important; letter-spacing: .02em; }
h1, h2, h3, .hname, .greet, .msg, .count { font-weight: 600 !important; letter-spacing: .04em; }
.panel, .hero, .habit, .nudge, .level { border-radius: 14px; box-shadow: none; border: 1px solid var(--line); }
.hero { background: var(--paper); }
.habit { background: var(--paper); border: 1px solid var(--line); }
.habit.done { background: color-mix(in srgb, var(--c) 9%, var(--paper)); border-color: color-mix(in srgb, var(--c) 55%, var(--line)); }
.check { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--c); background: transparent; }
.habit.done .check { border-style: solid; }
.hname { color: var(--ink); font-size: 18px !important; }
.menu { background: var(--soft); border-radius: 8px; }
.menu .tag { letter-spacing: .08em; }
.shuffle { background: transparent; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
.chip { border-radius: 999px; background: transparent; }
.chip.primary { background: var(--c); border-color: var(--c); color: var(--paper); }
.stamp { font-size: 11px; letter-spacing: .12em; border-width: 1px; border-radius: 2px; transform: rotate(-6deg); }
.stat b { font-size: 30px !important; font-weight: 500 !important; color: var(--ink); }
.count b { font-size: 40px !important; font-weight: 500; }
.stat .label, .label { letter-spacing: .12em; }
.level { background: var(--paper); }
.level .lv { background: var(--accent); color: var(--accent-ink); }
.xpbar { height: 3px !important; }
.xpbar i { background: var(--accent); }
.wgoal .xpbar i { background: var(--gold); }
.panel h2 { color: var(--ink); font-size: 17px; }

  }

      "--bg": "#fff8fb", "--paper": "#ffffff", "--ink": "#2a1d45", "--muted": "#76688f", "--line": "#efe2f2", "--soft": "#f8f0fb",

    moon: { name: "ムーンナイト", sw: "linear-gradient(135deg,#1a2a78 50%,#e8c26a 50%)", t: {

    month: (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })(),
  };

  // ---------- storage ----------
  // db (per-person private subtree) when available, otherwise this browser only.
  const store = { mode: "pending", col: null, pending: {}, chains: {} };
  const LS_KEY = "routine-notebook-v1";
  function lsLoad() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch { return null; } }
  function lsSave() { try { localStorage.setItem(LS_KEY, JSON.stringify({ days: state.days, settings: state.settings })); } catch {} }

  function queueSave(docId) {
    clearTimeout(store.pending[docId]);
    store.pending[docId] = setTimeout(() => flush(docId), 500);
    setSaveState("保存中…");
  }
  function flush(docId) {
    delete store.pending[docId];
    if (store.mode === "pending") { store.pending[docId] = setTimeout(() => flush(docId), 800); return; }
    if (store.mode === "local") { lsSave(); setSaveState("このブラウザに保存しました"); return; }
    const body = docId === "settings" ? { kind: "settings", ...state.settings } : { kind: "day", date: docId, ...state.days[docId] };
    const prev = store.chains[docId] || Promise.resolve();
    store.chains[docId] = prev.then(() => store.col.doc(docId).set(JSON.parse(JSON.stringify(body))))
      .then(() => setSaveState("保存しました（どの端末からでも同じ記録が見られます）"))
      .catch(e => {
        if (e && e.code === "unavailable") { setTimeout(() => queueSave(docId), 1500 + Math.random() * 1000); return; }
        setSaveState("保存できませんでした：" + (e && e.message ? e.message : "通信状態を確認してください"));
      });
  }
  function setSaveState(t) { $("saveState").textContent = t; }

  async function initStore() {
    const cached = lsLoad();
    if (cached) { state.days = cached.days || {}; state.settings = cached.settings || {}; render(); }
    let db = null, uid = null;
    try {
      if (window.claude && window.claude.use) {
        const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        db = d; uid = u ? await u.id() : null;
      }
    } catch { db = null; }
    if (!db || !uid) {
      store.mode = "local";
      setSaveState("このブラウザだけに保存しています（サインインすると端末をまたいで記録できます）");
      return;
    }
    store.col = db.collection("data/users/" + uid);
    store.mode = "db";
    setSaveState("同期しています…");
    let first = true;
    store.col.onSnapshot(snap => {
      const days = {}; let settings = null;
      for (const doc of snap.docs) {
        const v = doc.data(); if (!v) continue;
        if (doc.id === "settings") settings = v;
        else if (v.kind === "day") days[doc.id] = { done: v.done || {}, weight: v.weight ?? null, studyMin: v.studyMin || 0, memo: v.memo || "", menu: v.menu || {}, easy: !!v.easy, rest: !!v.rest };
      }
      // keep edits that haven't been sent yet
      for (const k of Object.keys(store.pending)) if (k !== "settings" && state.days[k]) days[k] = state.days[k];
      if (first && snap.empty && cached) {
        // first time on db: carry over what this browser had
        state.days = { ...cached.days, ...state.days };
        Object.keys(state.days).forEach(queueSave);
        if (cached.settings) queueSave("settings");
      } else {
        state.days = days;
        if (settings && !store.pending.settings) state.settings = { skin: settings.skin || null, targetWeight: settings.targetWeight ?? null, studyGoal: settings.studyGoal ?? null, weekGoal: settings.weekGoal ?? null, plans: settings.plans || {} };
      }
      if (first) setSaveState("同期しました（どの端末からでも同じ記録が見られます）");
      first = false;
      lsSave();
      render();
    }, e => setSaveState("同期が止まりました。ページを開き直してください（" + e.code + "）"));
  }

  // ---------- day helpers ----------
  function day(k) { return state.days[k] || { done: {}, weight: null, studyMin: 0, memo: "", menu: {} }; }
  function editDay(k, fn) {

  const isDone = (d, h) => h === "weight" ? typeof d.weight === "number" : !!(d.done && d.done[h]);
  const countDone = d => HABITS.filter(h => isDone(d, h.id)).length;

  // a rest day (お休みチケット) keeps every streak alive
  function streakFor(pred) {
    const ok = d => d.rest || pred(d);

    if (!ok(day(k))) k = addDays(k, -1);

    while (ok(day(k)) && n < 3650) { n++; k = addDays(k, -1); }
    return n;
  }
  const weekStart = k => { const d = parseKey(k); return addDays(k, -((d.getDay() + 6) % 7)); };
  const weekKeys = k => { const s0 = weekStart(k); return Array.from({ length: 7 }, (_, i) => addDays(s0, i)); };
  const ticketLeft = k => !weekKeys(k).some(x => day(x).rest);
  const PLAN_DEFAULT = { study: "夕ごはんのあとに", exercise: "歯みがきのあとに", stretch: "お風呂あがりに", beauty: "お風呂あがりに", weight: "お風呂に入る前に" };
  const planOf = id => (state.settings.plans && state.settings.plans[id]) || PLAN_DEFAULT[id];
  const EASY = { study: "テキストを1ページだけ開く", exercise: "スクワット1回だけ", stretch: "大きく伸びをして深呼吸1回", beauty: "保湿だけする" };
  function stats() {
    let xp = 0, perfect = 0, weighIns = 0, studyMin = 0, recDays = 0;
    const keys = Object.keys(state.days).sort();
    for (const k of keys) {
      const d = state.days[k], c = countDone(d);
      xp += c * 10 + (c === 5 ? 20 : 0);
      if (c === 5) perfect++;

  function levelOf(xp) {
    let lv = 1; while (50 * lv * (lv + 1) <= xp) lv++;

  function menuFor(k, h) {
    if (!h.menu.length) return "";

    if (d.easy && EASY[h.id]) return EASY[h.id];
    const idx = d.menu && typeof d.menu[h.id] === "number" ? d.menu[h.id] : hashStr(k + h.id) % h.menu.length;
    return h.menu[idx % h.menu.length];
  }
  function lastWeightBefore(k) {
    const keys = Object.keys(state.days).filter(x => x < k && typeof state.days[x].weight === "number").sort();
    return keys.length ? state.days[keys[keys.length - 1]].weight : null;
  }

  // ---------- timer (study) ----------
  const timer = { end: 0, id: null };
  function startTimer() {
    if (timer.id) { clearInterval(timer.id); timer.id = null; renderHabits(); return; }
    timer.end = Date.now() + 25 * 60 * 1000;
    timer.forKey = state.selected;
    timer.id = setInterval(() => {
      const left = timer.end - Date.now();
      const el = $("timerText");
      if (left <= 0) {
        clearInterval(timer.id); timer.id = null;
        editDay(timer.forKey, d => { d.studyMin = (d.studyMin || 0) + 25; d.done.study = true; });
        toast("25分集中できました。おつかれさま！"); celebrate(40);
        return;
      }
      if (el) el.textContent = `${pad(Math.floor(left / 60000))}:${pad(Math.floor(left / 1000) % 60)}`;
    }, 500);
    renderHabits();
  }

  // ---------- render ----------
  function render() {

    renderHeader(); renderHero(); renderHabits(); renderMemo(); renderCal(); renderChart(); renderBadges(); renderSettings();
  }
  function renderHeader() {

    $("lvTitle").textContent = TITLES[Math.min(L.lv - 1, TITLES.length - 1)];
    $("xpFill").style.width = Math.round((s.xp - L.base) / (L.next - L.base) * 100) + "%";
    $("xpText").textContent = `${s.xp} / ${L.next} XP`;
    const k = state.selected, d = parseKey(k), t = todayKey();
    $("dateText").textContent = `${d.getMonth() + 1}月${d.getDate()}日（${WD[d.getDay()]}）`;
    const diff = Math.round((parseKey(t) - d) / 86400000);
    $("dayLabel").textContent = diff === 0 ? "今日" : diff === 1 ? "きのう" : `${diff}日前`;
    $("goToday").hidden = diff === 0;
    $("nextDay").disabled = k >= t;
  }

      : ["この日の記録をつけられます。", "この日は1つ達成。", "この日は2つ達成。", "この日は3つ達成。", "この日は4つ達成。", "この日はパーフェクト！"];

  }
  function renderNudge() {

    const hadBefore = Object.keys(state.days).some(k => k < y && countDone(state.days[k]) > 0);

      <div class="btnrow"><button class="btn main" data-goto="${y}">きのうの分をつける</button>${left ? `<button class="btn" data-restday="${y}">お休みチケットを使う</button>` : ""}</div>`;

  function renderWeek() {

      return `<div class="${cls}">${WD[parseKey(k).getDay()]}<i>${k > t ? "" : d.rest ? "休" : c}</i></div>`; }).join("");
    $("wgoalText").textContent = `${goal}日チェックする`;
    $("wgoalNum").textContent = `${n} / ${goal}日`;

    $("ticketInfo").textContent = ticketLeft(t) ? "お休みチケット 残り1枚" : "お休みチケット 使用済み";
  }
  const SHORT = { study: "勉", exercise: "動", stretch: "伸", beauty: "美", weight: "kg" };
  const SHORTNAME = { study: "勉強", exercise: "運動", stretch: "ストレッチ", beauty: "美容", weight: "体重" };
  function renderQuick(d) {
    $("quick").innerHTML = HABITS.map(h => { const on = isDone(d, h.id);
      return `<button class="qbtn ${on ? "on" : ""}" style="--c: var(${h.color})" data-toggle="${h.id}" aria-pressed="${on}" aria-label="${h.name}を${on ? "未完了にする" : "完了にする"}"><span class="dot">${on ? CHECK_SVG : icon(h.id)}</span>${SHORTNAME[h.id]}</button>`; }).join("");
  }
  function renderHabits() {
    const k = state.selected, d = day(k);
    const goal = state.settings.studyGoal || 30;

      const done = isDone(d, h.id);
      const st = streakFor(x => isDone(x, h.id));
      let extra = `<div class="when">いつ：<b>${planOf(h.id)}</b></div>`;
      if (h.menu.length) extra += `<div class="menu"><span><span class="tag">${d.easy ? "ゆるモード" : h.tag}</span>${menuFor(k, h)}</span>${d.easy ? "" : `<button class="shuffle" data-shuffle="${h.id}" aria-label="${h.name}のメニューを変える">別のにする</button>`}</div>`;

        extra += `<div class="row"><span class="mins num">${d.studyMin || 0}<small>分</small></span><span class="diff">/ 目標 ${goal}分</span>
          <button class="chip" data-add="15">+15分</button><button class="chip" data-add="30">+30分</button>
          <button class="chip primary" data-timer>${running ? '止める <span class="timer" id="timerText" style="color:inherit">25:00</span>' : "25分タイマー"}</button>

  function renderMemo() {

  }
  function renderCal() {

  }
  function renderChart() {
    const t = todayKey(), pts = [];
    for (let i = 29; i >= 0; i--) { const k = addDays(t, -i), w = day(k).weight; if (typeof w === "number") pts.push({ i: 29 - i, k, w }); }
    const tw = state.settings.targetWeight;
    if (pts.length < 2) {
      $("chart").innerHTML = `<div class="empty-note">体重を2日以上記録すると、ここに30日間のグラフが出ます。${pts.length ? "あと1回です。" : "まずは今日の体重を入れてみましょう。"}</div>`;

    const padv = Math.max(0.5, (hi - lo) * 0.15); lo = Math.floor((lo - padv) * 2) / 2; hi = Math.ceil((hi + padv) * 2) / 2;
    const x = i => L + i / 29 * (W - L - Rr), y = v => T + (hi - v) / (hi - lo) * (H - T - B);

    s += ticks.map(v => `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v.toFixed(1)}</text>`).join("");
    [0, 14, 29].forEach(i => { const d = parseKey(addDays(t, i - 29)); s += `<text x="${x(i)}" y="${H - 10}" text-anchor="${i === 0 ? "start" : i === 29 ? "end" : "middle"}">${d.getMonth() + 1}/${d.getDate()}</text>`; });
    if (tw && tw >= lo && tw <= hi) s += `<line x1="${L}" x2="${W - Rr}" y1="${y(tw)}" y2="${y(tw)}" stroke="var(--stretch)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W - Rr}" y="${y(tw) - 5}" text-anchor="end" style="fill:var(--stretch)">目標 ${tw.toFixed(1)}</text>`;

    s += pts.map((p, j) => `<circle cx="${x(p.i)}" cy="${y(p.w)}" r="${j === pts.length - 1 ? 5 : 2.5}" fill="var(--weight)" stroke="var(--paper)" stroke-width="${j === pts.length - 1 ? 2 : 0}"/>`).join("");
    s += `</svg>`;
    $("chart").innerHTML = s;
    const df = pts[pts.length - 1].w - pts[0].w;
    $("wSummary").textContent = `最新 ${pts[pts.length - 1].w.toFixed(1)}kg（30日で ${df > 0 ? "+" : ""}${df.toFixed(1)}）`;
  }
  function renderBadges() {

  function renderSettings() {

    if (document.activeElement !== sg) sg.value = state.settings.studyGoal ?? "";
    const wg = $("weekGoal"); if (document.activeElement !== wg) wg.value = state.settings.weekGoal ?? "";
    if (!$("plans").childElementCount) $("plans").innerHTML = HABITS.map(h => `<label class="plan" for="plan-${h.id}">${h.name.replace(/（.*）/, "")}<input id="plan-${h.id}" data-plan="${h.id}" type="text" maxlength="30" placeholder="${PLAN_DEFAULT[h.id]}"></label>`).join("");
    HABITS.forEach(h => { const el = $("plan-" + h.id); if (document.activeElement !== el) el.value = (state.settings.plans || {})[h.id] || ""; });
  }

  // ---------- fun ----------
  let toastT;
  function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2200); }
  function celebrate(n = 120) {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cv = $("confetti"), ctx = cv.getContext("2d"), dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
    const cs = getComputedStyle(document.documentElement);
    const cols = HABITS.map(h => cs.getPropertyValue(h.color).trim()).concat([cs.getPropertyValue("--gold").trim()]);
    const ps = Array.from({ length: n }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .35, vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4, r: Math.random() * 6 + 4, a: Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)] }));
    let f = 0;
    (function step() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
      if (++f < 110) requestAnimationFrame(step); else ctx.clearRect(0, 0, innerWidth, innerHeight);
    })();
  }
  const CHEERS = ["完了", "いいですね", "その調子", "素敵です", "Good"];
  function afterCheck(k, h, before) {
    const after = countDone(day(k));
    if (after === 5 && before < 5) { toast("今日の花が満開に。+20XP"); celebrate(); }
    else toast(`${h.name} ${CHEERS[Math.floor(Math.random() * CHEERS.length)]} +10XP`);
    const card = document.querySelector(`[data-h="${h.id}"]`); if (card) card.classList.add("pop");
    const src = document.querySelector(`#quick [data-toggle="${h.id}"]`)?.offsetParent ? document.querySelector(`#quick [data-toggle="${h.id}"]`) : card && card.querySelector(".check");
    if (src && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      const r = src.getBoundingClientRect(), el = document.createElement("div");
      el.className = "plus"; el.style.setProperty("--c", `var(${h.color})`); el.textContent = "+10";
      el.style.left = (r.left + r.width / 2 - 14) + "px"; el.style.top = (r.top - 6) + "px";
      document.body.appendChild(el); setTimeout(() => el.remove(), 1000);
    }
  }

  // ---------- events ----------
  $("habits").addEventListener("click", e => {
    const k = state.selected, b = e.target.closest("button"); if (!b) return;
    if (b.dataset.toggle) {
      toggleHabit(b.dataset.toggle);
    } else if (b.dataset.shuffle) {
      const h = HABITS.find(x => x.id === b.dataset.shuffle), cur = h.menu.indexOf(menuFor(k, h));
      editDay(k, d => { d.menu = d.menu || {}; d.menu[h.id] = (cur + 1 + Math.floor(Math.random() * (h.menu.length - 1))) % h.menu.length; });
    } else if (b.dataset.add != null) {
      const add = Number(b.dataset.add), before = countDone(day(k)), was = isDone(day(k), "study");
      editDay(k, d => { d.studyMin = add ? (d.studyMin || 0) + add : 0; if (add) d.done.study = true; });
      if (add && !was) afterCheck(k, HABITS[0], before);
    } else if (b.hasAttribute("data-timer")) {
      startTimer();
    } else if (b.hasAttribute("data-wsave")) {
      saveWeight();
    } else if (b.hasAttribute("data-wclear")) {
      editDay(k, d => { d.weight = null; });
    }
  });
  function toggleHabit(id) {
    const k = state.selected, h = HABITS.find(x => x.id === id), before = countDone(day(k)), wasDone = isDone(day(k), h.id);
    if (h.id === "weight") {
      if (wasDone) { editDay(k, d => { d.weight = null; }); return; }
      const inp = $("weightIn");
      if (inp) { inp.scrollIntoView({ block: "center", behavior: "smooth" }); inp.focus({ preventScroll: true }); toast("体重を入れて「記録」を押してください"); }
      return;
    }
    editDay(k, d => { d.done[h.id] = !wasDone; });
    if (!wasDone) afterCheck(k, h, before);
  }
  $("quick").addEventListener("click", e => { const b = e.target.closest("[data-toggle]"); if (b) { toggleHabit(b.dataset.toggle); if (navigator.vibrate) try { navigator.vibrate(15); } catch {} } });
  // swipe left/right on the top area to change the day
  let sx = null, sy = 0;
  const swipeZone = document.querySelector(".hero");
  swipeZone.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  swipeZone.addEventListener("touchend", e => {
    if (sx == null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)) return;
    if (dx > 0) selectDay(addDays(state.selected, -1)); else if (state.selected < todayKey()) selectDay(addDays(state.selected, 1));
  }, { passive: true });
  $("habits").addEventListener("keydown", e => { if (e.target.id === "weightIn" && e.key === "Enter") { e.preventDefault(); saveWeight(); } });
  function saveWeight() {
    const k = state.selected, v = parseFloat($("weightIn").value);
    if (!(v > 20 && v < 300)) { toast("体重は 20〜300 kg の数字で入れてください"); return; }
    const before = countDone(day(k)), was = isDone(day(k), "weight");
    editDay(k, d => { d.weight = Math.round(v * 10) / 10; });
    if (!was) afterCheck(k, HABITS[4], before); else toast("体重を更新しました");
  }
  let memoT;
  $("memo").addEventListener("input", e => { const k = state.selected, v = e.target.value; clearTimeout(memoT); memoT = setTimeout(() => { const d = JSON.parse(JSON.stringify(day(k))); d.memo = v; state.days[k] = d; queueSave(k); lsSave(); }, 700); });
  function selectDay(k) { state.selected = k; const d = parseKey(k); state.month = new Date(d.getFullYear(), d.getMonth(), 1); render(); }
  $("prevDay").onclick = () => selectDay(addDays(state.selected, -1));
  $("nextDay").onclick = () => { if (state.selected < todayKey()) selectDay(addDays(state.selected, 1)); };
  $("goToday").onclick = () => selectDay(todayKey());
  $("cal").addEventListener("click", e => { const b = e.target.closest("[data-day]"); if (b && !b.disabled) { selectDay(b.dataset.day); window.scrollTo({ top: 0, behavior: "smooth" }); } });
  $("prevMonth").onclick = () => { state.month = new Date(state.month.getFullYear(), state.month.getMonth() - 1, 1); renderCal(); };
  $("nextMonth").onclick = () => { state.month = new Date(state.month.getFullYear(), state.month.getMonth() + 1, 1); renderCal(); };
  function settingInput(id, field, min, max) {
    $(id).addEventListener("change", e => {
      const v = e.target.value === "" ? null : Number(e.target.value);
      if (v != null && !(v >= min && v <= max)) { toast(`${min}〜${max} の数字で入れてください`); renderSettings(); return; }
      state.settings = { ...state.settings, [field]: v }; queueSave("settings"); lsSave(); render(); toast("設定を保存しました");
    });
  }
  settingInput("target", "targetWeight", 20, 300);
  settingInput("studyGoal", "studyGoal", 5, 600);
  settingInput("weekGoal", "weekGoal", 1, 7);
  $("skins").addEventListener("click", e => { const b = e.target.closest("[data-skin]"); if (!b) return;
    state.settings = { ...state.settings, skin: b.dataset.skin }; queueSave("settings"); lsSave(); render(); toast(`きせかえ：${SKINS[b.dataset.skin].name}`); });
  $("plans").addEventListener("change", e => { const id = e.target.dataset.plan; if (!id) return;
    state.settings = { ...state.settings, plans: { ...(state.settings.plans || {}), [id]: e.target.value.trim() } }; queueSave("settings"); lsSave(); render(); toast("「いつやる？」を保存しました"); });
  $("dayBtns").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; const k = state.selected;
    if (b.hasAttribute("data-easy")) { const on = !day(k).easy; editDay(k, d => { d.easy = on; }); toast(on ? "ゆるモード：ほんの少しでOK。やれば1つ達成です" : "いつものメニューに戻しました"); }
    if (b.hasAttribute("data-rest")) { const on = !day(k).rest; editDay(k, d => { d.rest = on; }); toast(on ? "お休みの日にしました。連続記録はそのままです" : "お休みを取り消しました"); } });
  $("nudge").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.goto) selectDay(b.dataset.goto);
    if (b.dataset.restday) { editDay(b.dataset.restday, d => { d.rest = true; }); toast("お休みチケットを使いました。連続記録はそのままです"); } });
  // date rollover while the page stays open
  let lastToday = todayKey();
  setInterval(() => { const t = todayKey(); if (t !== lastToday) { if (state.selected === lastToday) state.selected = t; lastToday = t; render(); } }, 60000);

  render();
  initStore();
})();
</script>
